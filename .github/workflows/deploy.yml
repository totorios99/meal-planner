name: CI and publish

# Pushing to main does not merely publish an image: watchtower pulls it within 300s and the
# container runs scripts/migrate.js at startup, which migrates PRODUCTION. So `build` is gated
# on `test` — a red suite means no image, which means nothing to pull, which means the
# migration never runs.
on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24, not the Dockerfile's 20: the runner has to execute .ts through Vitest, and
      # type stripping needs 22.6+. The runtime image is untouched — it only ever runs the
      # already-built server.js, which is why tests run here and not in a Docker stage.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # app/generated/prisma is gitignored, so a clean checkout has no client and every import
      # of it fails. prisma.config.ts reads DATABASE_URL, so it must be set even to generate —
      # nothing connects to this path during generate.
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: file:./db/meal-planner.db

      - run: npm run lint

      - run: npm run typecheck

      # vitest.config.mts supplies its own DATABASE_URL under .test-db, and both setup files
      # refuse to run against anything else.
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    # PRs are checked but never published. Only a push to main produces an image.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
