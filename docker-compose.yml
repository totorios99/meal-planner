services:
  mise:
    # Built and pushed to GHCR by .github/workflows/deploy.yml on every push to main.
    # The global watchtower (labelled containers, 300s poll) pulls new :latest and recreates.
    image: ghcr.io/totorios99/meal-planner:latest
    container_name: mise
    ports:
      - "3000:3000"
    volumes:
      - /DATA/AppData/mise:/app/data
    environment:
      - DATABASE_URL=file:/app/data/meal-planner.db
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Clerk — publishable key is client-visible by design; the secret key never is.
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set in .env}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:?set in .env}
      - NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in
      - NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up
      - NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=/
      - NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=/
      # Server-only. Agent/MCP access, sent as the x-mise-admin-secret header. Never
      # NEXT_PUBLIC_-prefixed, never in a URL.
      - MISE_ADMIN_SECRET=${MISE_ADMIN_SECRET:-}
      - MISE_OWNER_USER_ID=${MISE_OWNER_USER_ID:-}
    restart: unless-stopped
    healthcheck:
      # /sign-in is the one route Clerk always lets through — everything else redirects or 401s.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/sign-in"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Owns the name mise.neurotrichini-darter.ts.net so Let's Encrypt will issue a cert for it —
  # Clerk's session cookie is Secure, so the app has to be served over HTTPS. Routes no traffic:
  # AdGuard rewrites that name to the LAN IP and nginx-proxy-manager terminates TLS with the cert
  # this node fetches. Userspace mode, so no TUN device and no host networking.
  # State (the node's identity) lives in the bind mount — recreating this container is safe and
  # does not need a re-auth. scripts/renew-mise-cert.sh execs into it by name.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-mise
    volumes:
      - /DATA/AppData/tailscale-mise:/var/lib/tailscale
    environment:
      - TS_HOSTNAME=mise
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
    restart: unless-stopped

x-casaos:
  architectures:
    - amd64
    - arm64
    - arm
  main: mise
  title:
    en_us: Mise
  description:
    en_us: Personal meal planner with weekly planning, macro tracking, and print-ready meal references.
  tagline:
    en_us: Meal planning, simplified.
  developer: Antonio Rios
  author: Antonio Rios
  category: Utilities
  port_map: "3000"
  icon: "data:image/svg+xml;base64,"
