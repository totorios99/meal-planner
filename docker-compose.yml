services:
  mise:
    # Built and pushed to GHCR by .github/workflows/deploy.yml on every push to main.
    # The global watchtower (labelled containers, 300s poll) pulls new :latest and recreates.
    image: ghcr.io/totorios99/meal-planner:latest
    container_name: mise
    ports:
      - "3000:3000"
    volumes:
      - /DATA/AppData/mise:/app/data
    environment:
      - DATABASE_URL=file:/app/data/meal-planner.db
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - MISE_API_KEY=${MISE_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      # /login is the one route the auth gate always lets through — /api/meals now 401s.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      com.centurylinklabs.watchtower.enable: "true"

x-casaos:
  architectures:
    - amd64
    - arm64
    - arm
  main: mise
  title:
    en_us: Mise
  description:
    en_us: Personal meal planner with weekly planning, macro tracking, and print-ready meal references.
  tagline:
    en_us: Meal planning, simplified.
  developer: Antonio Rios
  author: Antonio Rios
  category: Utilities
  port_map: "3000"
  icon: "data:image/svg+xml;base64,"
